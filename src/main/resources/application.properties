# =============================================
# Configuración de la Aplicación — MySQL Local
# =============================================

spring.application.name=bdget

# --- Base de Datos MySQL ---
# Cuando corres con docker-compose, el host es "mysql" (nombre del servicio)
# Cuando corres directo en tu PC, cambia "mysql" por "localhost"
spring.datasource.url=jdbc:mysql://mysql:3306/bdget_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=bdget_user
spring.datasource.password=bdget_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Servidor ---
server.port=8080

# --- Logs ---
logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
